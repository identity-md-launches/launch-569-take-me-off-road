[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# v4-core 1.0.2's PoolManager is written for exactly 0.8.26; the independent verifier carries it.
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
# Transient storage (the reentrancy lock on slot 1 and the PoolManager's own locks) needs Cancun.
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false

ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32
depth = 24
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
